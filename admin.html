<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kive Tea Admin</title><style>body{font-family:Arial,sans-serif;max-width:1200px;margin:32px auto;padding:0 18px;color:#14261d;background:#f7faf5}button,input,select{padding:9px;margin:3px;border:1px solid #ccd8ce;border-radius:6px}button{cursor:pointer;background:#14261d;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.muted,#message{color:#68776e}table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff}td,th{border-bottom:1px solid #ddd;padding:12px;text-align:left;vertical-align:top}small{line-height:1.5}.badge{padding:4px 7px;border-radius:12px;background:#e5efe5;font-size:12px}@media(max-width:760px){table{font-size:12px}td,th{padding:8px}}</style></head><body><h1>Kive Tea Admin</h1><p class="muted">Dashboard development. Gunakan token ADMIN_TOKEN.</p><div class="toolbar"><input id="token" type="password" placeholder="ADMIN_TOKEN"><input id="search" placeholder="Cari ID / nama / WhatsApp"><select id="filter"><option value="all">Semua status</option><option>baru</option><option>diproses</option><option>siap_diambil</option><option>dikirim</option><option>selesai</option><option>dibatalkan</option></select><button id="load">Muat pesanan</button></div><p id="message"></p><table><thead><tr><th>Order</th><th>Pelanggan</th><th>Total</th><th>Pembayaran</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="orders"></tbody></table><script>let all=[];const token=()=>document.querySelector('#token').value;const msg=t=>document.querySelector('#message').textContent=t;const esc=s=>String(s??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;const rows=all.filter(o=>(f==='all'||o.fulfillmentStatus===f)&&(`${o.id} ${o.fulfillment?.name||''} ${o.fulfillment?.phone||''}`).toLowerCase().includes(q));document.querySelector('#orders').innerHTML=rows.map(o=>`<tr><td><strong>${esc(o.id)}</strong><br><small>${new Date(o.createdAt).toLocaleString('id-ID')}<br>${o.items.map(i=>esc(i.name)+' x'+i.qty).join('<br>')}</small></td><td>${esc(o.fulfillment?.name)}<br>${esc(o.fulfillment?.phone)}<br><span class="badge">${esc(o.fulfillment?.method)}</span><br><small>${esc(o.fulfillment?.address)}<br>${esc(o.fulfillment?.note)}</small></td><td>Rp ${o.total.toLocaleString('id-ID')}</td><td>${esc(o.paymentStatus)}</td><td>${esc(o.fulfillmentStatus)}</td><td><select data-id="${esc(o.id)}"><option>baru</option><option>diproses</option><option>siap_diambil</option><option>dikirim</option><option>selesai</option><option>dibatalkan</option></select><button data-update="${esc(o.id)}">Simpan</button></td></tr>`).join('')||'<tr><td colspan="6">Tidak ada order.</td></tr>';document.querySelectorAll('select[data-id]').forEach(s=>s.value=all.find(o=>o.id===s.dataset.id)?.fulfillmentStatus||'baru');}async function load(){const r=await fetch('/api/admin/orders',{headers:{'x-admin-token':token()}});const d=await r.json();if(!r.ok)return msg(d.error);all=d.orders.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));render();msg(`${all.length} order dimuat`);}document.querySelector('#load').onclick=load;document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;document.querySelector('#orders').onclick=async e=>{const id=e.target.dataset.update;if(!id)return;const s=document.querySelector(`select[data-id="${CSS.escape(id)}"]`);const r=await fetch('/api/admin/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-token':token()},body:JSON.stringify({status:s.value})});msg(r.ok?'Status diperbarui':(await r.json()).error);if(r.ok)load();};</script></body></html>
