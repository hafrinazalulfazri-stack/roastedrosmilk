<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pesanan — Kive Tea</title><style>body{font-family:Arial,sans-serif;max-width:680px;margin:50px auto;padding:0 20px;color:#14261d;background:#f7faf5}form{display:flex;gap:8px}input,button{padding:12px;border:1px solid #ccd8ce;border-radius:6px;font:inherit}input{flex:1}button{background:#14261d;color:#fff;cursor:pointer}.card{background:#fff;margin-top:24px;padding:24px;border-radius:12px;box-shadow:0 8px 30px #14261d12}.muted{color:#68776e}.badge{display:inline-block;padding:6px 10px;border-radius:14px;background:#e5efe5;margin:3px 0}.items{border-top:1px solid #e1e8e1;margin-top:16px;padding-top:12px}</style></head><body><h1>Status Pesanan</h1><p class="muted">Masukkan ID order untuk melihat status terbaru.</p><form id="form"><input id="order-id" placeholder="Contoh: KT-20261006-ABC123" required><button>Cek status</button></form><p id="message" class="muted"></p><section id="result" class="card" hidden></section><script>const esc=s=>String(s??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const form=document.querySelector('#form');const result=document.querySelector('#result');const message=document.querySelector('#message');form.onsubmit=async e=>{e.preventDefault();message.textContent='Memuat...';result.hidden=true;const id=document.querySelector('#order-id').value.trim();try{const r=await fetch('/api/orders/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error);const o=d.order;result.innerHTML=`<h2>${esc(o.id)}</h2><p>Dibuat ${new Date(o.createdAt).toLocaleString('id-ID')}</p><p>Pembayaran<br><strong class="badge">${esc(o.paymentStatus)}</strong></p><p>Pemenuhan<br><strong class="badge">${esc(o.fulfillmentStatus)}</strong></p><div class="items">${o.items.map(i=>`<p>${esc(i.name)} × ${i.qty}<br>Rp ${(i.subtotal).toLocaleString('id-ID')}</p>`).join('')}<strong>Total: Rp ${o.total.toLocaleString('id-ID')}</strong></div>`;result.hidden=false;message.textContent='';}catch(error){message.textContent=error.message||'Order tidak ditemukan';}};</script></body></html>
